name: ai4i-predictive-maintenance
description: Classification des défaillances de machines à partir de données industrielles synthétiques.

source:
  url: https://archive.ics.uci.edu/dataset/601/ai4i+2020+predictive+maintenance+dataset
  license: CC BY 4.0
  citation: >-
    AI4I 2020 Predictive Maintenance Dataset. (2020).
    UCI Machine Learning Repository.
    https://doi.org/10.24432/C5HS5C

raw_path: data/raw/dataset.csv

target:
  column: Machine failure
  positive_class: 1

features:
  numeric:
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
  categorical:
    - Type

# Aucun attribut personnel sensible dans ces données industrielles.
sensitive: []

metrics:
  primary: roc_auc
  # Seuil pédagogique conservé pour le lab.
  promotion_threshold: 0.70
  # Hypothèse pédagogique : une panne manquée coûte 5 fois
  # plus qu'une fausse alerte. Ce ne sont pas des coûts mesurés.
  cost_matrix:
    false_negative: 5
    false_positive: 1

split:
  test_size: 0.2
  random_state: 42
