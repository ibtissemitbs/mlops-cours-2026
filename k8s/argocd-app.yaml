---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoring-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ibtissemitbs/mlops-cours-2026.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: scoring-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoring-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ibtissemitbs/mlops-cours-2026.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: scoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
