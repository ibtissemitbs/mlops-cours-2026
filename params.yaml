prepare:
  id_column: request_id
  event_timestamp: '2026-01-01T00:00:00+00:00'
  validation_size: 0.2
train:
  model: logistic_regression
  C: 0.1
  class_weight: balanced
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  random_state: 42
  hidden_layer_sizes:
  - 32
  alpha: 0.0001
  learning_rate_init: 0.001
  max_iter: 500
