prepare:
  id_column: request_id
  event_timestamp: '2026-01-01T00:00:00+00:00'
  validation_size: 0.2
train:
  model: gradient_boosting
  C: 0.1
  class_weight: balanced
  n_estimators: 100
  max_depth: 3
  learning_rate: 0.1
  random_state: 42
  hidden_layer_sizes:
  - 32
  alpha: 0.0001
  learning_rate_init: 0.001
  max_iter: 500
# Lab 3 : détection de drift
drift:
  ks_alpha: 0.05
  psi_threshold: 0.25
  drift_share: 0.1
  simulation:
    shift:
      "Air temperature [K]": 3.0
      "Process temperature [K]": 3.0
