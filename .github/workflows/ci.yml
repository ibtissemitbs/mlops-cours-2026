name: CI scoring

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "pipelines/**"
      - "tests/**"
      - "dataset.yaml"
      - "params.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_VERSION: "2.1"

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - name: Installer les dépendances
        run: uv sync --python 3.12
      - name: Vérifier le code et le formatage
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Lancer pytest
        run: uv run pytest -v

  build:
    name: Construire et tester l’image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: docker/setup-buildx-action@v4

      - name: Calculer le tag et lire la version du modèle
        id: meta
        run: |
          tag="${API_VERSION}.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            tag="${tag}-${GITHUB_RUN_ATTEMPT}"
          fi
          model_version=$(jq -er '.model_version' packaging/model/metadata.json)
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/scoring-api"
            echo "tag=$tag"
            echo "model_version=$model_version"
          } >> "$GITHUB_OUTPUT"

      - name: Construire l’image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            MODEL_VERSION=${{ steps.meta.outputs.model_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tester le conteneur
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 "$IMAGE"
          trap 'docker rm -f api >/dev/null' EXIT

          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 \
            --max-time 5 http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/version |
            jq -e --arg tag "$TAG" '.version == $tag'

          uv run --no-project --python 3.12 --with pyyaml==6.0.3 --with pandas==2.3.3 \
            python -m pipelines.gitops payload > request.json

          curl -fsS http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" --data-binary @request.json |
            jq -e '.predictions | length == 1'

      - name: Se connecter à GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l’image testée
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

  deploy-staging:
    name: Mettre à jour le tag de staging dans Git
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Enregistrer le nouveau tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-project --python 3.12 --with pyyaml==6.0.3 \
            python -m pipelines.gitops deploy --env staging \
            --image "$IMAGE" --tag "$TAG" --note "[${GITHUB_SHA::7}]" --push
